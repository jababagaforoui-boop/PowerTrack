<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register | PowerTrack</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-green-400 via-blue-400 to-purple-500 min-h-screen flex items-center justify-center font-sans">

<!-- Register Card -->
<div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-8">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Create Your Account</h2>
    <p class="text-center text-gray-500 mb-8">Join PowerTrack to monitor and save energy efficiently!</p>

    <form id="registerForm" class="space-y-4">
        <div>
            <input type="text" name="name" placeholder="Full Name" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition" />
        </div>
        <div>
            <input type="email" name="email" placeholder="Email" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition" />
        </div>
        <div>
            <input type="password" name="password" placeholder="Password" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition" />
        </div>
        <div>
            <input type="text" name="address" placeholder="Address" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-transparent transition" />
        </div>
        <button type="submit"
            class="w-full bg-gradient-to-r from-green-400 to-blue-500 text-white font-bold py-3 rounded-lg shadow-lg hover:from-green-500 hover:to-blue-600 transition">
            Register
        </button>
    </form>

    <p class="text-center text-gray-500 mt-6">
        Already have an account?
        <a href="login.html" class="text-blue-500 font-semibold hover:underline">Login</a>
    </p>
</div>

<script>
document.getElementById('registerForm').onsubmit = async function(e){
    e.preventDefault();
    let formData = new FormData(this);
    const res = await axios.post('../backend/api/users.php?action=register', formData);
    alert(res.data.message);
    if(res.data.status=='success') location.href='login.html';
}
</script>
</body>
</html>
