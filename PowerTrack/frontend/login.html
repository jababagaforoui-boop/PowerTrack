<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | PowerTrack</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-400 via-pink-400 to-red-400 min-h-screen flex items-center justify-center font-sans">

<!-- Login Card -->
<div class="bg-white shadow-2xl rounded-2xl w-full max-w-md p-8">
    <h2 class="text-3xl font-bold text-center text-gray-800 mb-6">Welcome Back</h2>
    <p class="text-center text-gray-500 mb-8">Log in to track and manage your energy usage!</p>

    <form id="loginForm" class="space-y-4">
        <div>
            <input type="email" name="email" placeholder="Email" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition" />
        </div>
        <div>
            <input type="password" name="password" placeholder="Password" required
                class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition" />
        </div>
        <button type="submit"
            class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold py-3 rounded-lg shadow-lg hover:from-purple-600 hover:to-pink-600 transition">
            Login
        </button>
    </form>

    <p class="text-center text-gray-500 mt-6">
        Don't have an account?
        <a href="register.html" class="text-blue-500 font-semibold hover:underline">Register</a>
    </p>
</div>

<script>
document.getElementById('loginForm').onsubmit = async function(e){
    e.preventDefault();
    let formData = new FormData(this);
    const res = await axios.post('../backend/api/users.php?action=login', formData);
    alert(res.data.message);
    if(res.data.status=='success') location.href='dashboard.html';
}
</script>
</body>
</html>
