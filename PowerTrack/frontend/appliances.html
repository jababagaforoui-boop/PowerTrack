<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appliances | PowerTrack</title>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' }
</script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen font-sans transition-colors duration-500">

<!-- Navbar -->
<nav class="bg-gray-100 dark:bg-gray-900 p-4 flex justify-between items-center shadow-md">
    <div class="flex items-center gap-4">
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">PowerTrack</h1>
        <a href="dashboard.html" class="bg-gradient-to-r from-green-400 to-blue-500 text-white px-4 py-2 rounded-lg font-semibold shadow hover:from-green-500 hover:to-blue-600 transition">Dashboard</a>
        <a href="appliances.html" class="bg-gradient-to-r from-green-400 to-blue-500 text-white px-4 py-2 rounded-lg font-semibold shadow hover:from-green-500 hover:to-blue-600 transition">Appliances</a>
    </div>
    <div class="flex items-center gap-4">
        <button id="darkModeToggle" class="bg-white text-gray-800 dark:bg-gray-700 dark:text-gray-200 px-4 py-2 rounded-lg font-semibold shadow hover:bg-gray-200 dark:hover:bg-gray-600 transition">Dark Mode</button>
        <a href="login.html" class="bg-red-500 px-4 py-2 rounded-lg shadow hover:bg-red-600 transition">Logout</a>
    </div>
</nav>

<main class="p-6">
    <div class="flex justify-end mb-6">
        <button id="addApplianceBtn" class="bg-gradient-to-r from-green-400 to-blue-500 text-white font-bold px-6 py-2 rounded-lg shadow hover:from-green-500 hover:to-blue-600 transition">Add Appliance</button>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="applianceCards"></div>
</main>

<!-- Modal -->
<div id="addApplianceModal" class="fixed inset-0 bg-black bg-opacity-50 hidden justify-center items-center z-50">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6 w-11/12 max-w-md relative">
        <h2 class="text-xl font-semibold mb-4 text-gray-900 dark:text-gray-100">Add New Appliance</h2>
        <form id="addApplianceForm" class="grid grid-cols-1 gap-4">
            <input type="hidden" name="user_id" value="1">
            <input type="text" name="name" placeholder="Appliance Name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-400 dark:focus:ring-green-600 transition">
            <select name="category" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-400 dark:focus:ring-green-600 transition">
                <option value="">Select Category</option>
                <option value="Fridge">Fridge</option>
                <option value="AC">AC</option>
                <option value="TV">TV</option>
                <option value="Light">Light</option>
                <option value="Oven">Oven</option>
            </select>
            <input type="number" name="wattage" placeholder="Wattage (W)" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-400 dark:focus:ring-green-600 transition">
            <input type="text" name="usage_schedule" placeholder="Usage Schedule (e.g., 2h/day)" class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-400 dark:focus:ring-green-600 transition">
            <input type="text" name="room" placeholder="Room / Location" required class="w-full px-4 py-3 rounded-lg border border-gray-300 dark:border-gray-600 focus:outline-none focus:ring-2 focus:ring-green-400 dark:focus:ring-green-600 transition">
            <div class="flex justify-end gap-4 mt-2">
                <button type="button" id="cancelModal" class="px-4 py-2 rounded-lg bg-gray-300 dark:bg-gray-700 hover:bg-gray-400 dark:hover:bg-gray-600 transition">Cancel</button>
                <button type="submit" class="bg-gradient-to-r from-green-400 to-blue-500 text-white font-bold px-4 py-2 rounded-lg shadow hover:from-green-500 hover:to-blue-600 transition">Add</button>
            </div>
        </form>
    </div>
</div>

<script>
// Dark Mode
document.getElementById('darkModeToggle').onclick = () => {
    document.documentElement.classList.toggle('dark');
}

// Modal
const modal = document.getElementById('addApplianceModal');
document.getElementById('addApplianceBtn').onclick = () => modal.classList.remove('hidden');
document.getElementById('cancelModal').onclick = () => modal.classList.add('hidden');

// Appliance icons
const applianceIcons = {
    'Fridge':'https://img.icons8.com/color/48/000000/refrigerator.png',
    'AC':'https://img.icons8.com/color/48/000000/air-conditioner.png',
    'TV':'https://img.icons8.com/color/48/000000/retro-tv.png',
    'Light':'https://img.icons8.com/color/48/000000/light-on.png',
    'Oven':'https://img.icons8.com/color/48/000000/oven.png',
    'Default':'https://img.icons8.com/color/48/000000/electrical.png'
};

let appliances = [];
async function loadAppliances(){
    try{
        const res = await axios.get('../backend/appliances.php?action=list');
        appliances = res.data;
        renderAppliances(appliances);
    }catch(err){
        console.error(err);
        alert("Failed to load appliances. Check console.");
    }
}

function renderAppliances(list){
    const container = document.getElementById('applianceCards');
    container.innerHTML = '';
    list.forEach(app=>{
        const icon = applianceIcons[app.category] || applianceIcons['Default'];
        const card = document.createElement('div');
        card.className = "bg-white dark:bg-gray-800 shadow-lg rounded-xl p-6 flex flex-col items-center text-center hover:scale-105 transition transform relative";
        card.innerHTML = `
            <img src="${icon}" class="w-16 h-16 mb-2 animate-bounce" alt="${app.name}"/>
            <h3 class="text-lg font-semibold">${app.name}</h3>
            <p class="text-gray-500 dark:text-gray-300">${app.category}</p>
            <p class="text-gray-500 dark:text-gray-300">Wattage: ${app.wattage}W</p>
            <p class="text-gray-500 dark:text-gray-300">Room: ${app.room}</p>
            <button onclick="removeAppliance(${app.id})" class="mt-2 bg-red-500 text-white px-3 py-1 rounded-lg hover:bg-red-600 transition absolute top-2 right-2">×</button>
        `;
        container.appendChild(card);
    });
}

document.getElementById('addApplianceForm').onsubmit = async function(e){
    e.preventDefault();
    let formData = new FormData(this);
    try{
        const res = await axios.post('../backend/appliances.php?action=add', formData, { headers: { 'Content-Type': 'multipart/form-data' } });
        alert(res.data.message);
        if(res.data.status==='success'){
            loadAppliances();
            modal.classList.add('hidden');
            this.reset();
        }
    }catch(err){
        console.error(err);
        alert("Failed to add appliance. Check console.");
    }
}

async function removeAppliance(id){
    if(!confirm("Are you sure?")) return;
    try{
        const res = await axios.post(`../backend/appliances.php?action=remove&id=${id}`);
        alert(res.data.message);
        if(res.data.status==='success') loadAppliances();
    }catch(err){
        console.error(err);
        alert("Failed to remove appliance.");
    }
}

// Initial load
loadAppliances();
</script>
</body>
</html>
